<style>
* { margin:0; padding:0; box-sizing:border-box; }

.wrap {
  background: #080f1a;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 70px 0 90px;
  position: relative;
  overflow: hidden;
}

.stars { position:absolute; inset:0; pointer-events:none; }
.star {
  position:absolute; background:white; border-radius:50%;
  animation: twinkle var(--d,3s) var(--delay,0s) ease-in-out infinite; opacity:0;
}
@keyframes twinkle {
  0%,100%{ opacity:0; transform:scale(1); }
  50%    { opacity:var(--op,.7); transform:scale(1.4); }
}

/* ── ESCENA ── */
.scene {
  display: flex;
  align-items: flex-end;
  gap: 32px;
  position: relative;
  z-index: 1;
  transform: scale(1);
  transform-origin: center bottom;
}

/* 📱 Celulares */
@media (max-width: 600px) {
  .scene {
    transform: scale(0.7);
  }
}

/* 📲 Tablets */
@media (max-width: 900px) {
  .scene {
    transform: scale(0.85);
  }
}

/* 🖥️ Pantallas grandes */
@media (min-width: 1400px) {
  .scene {
    transform: scale(1.2);
  }
}

/* TEXTO */
.mensaje {
  margin-top: 40px;
  font-size: 28px;
  color: #fff;
  text-align: center;
  font-family: 'Georgia', serif;
  letter-spacing: 2px;
  text-shadow: 0 0 10px rgba(255,255,255,0.6),
               0 0 20px rgba(255,105,180,0.5),
               0 0 40px rgba(255,20,147,0.3);
  animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
  from { opacity:0; transform:translateY(20px); }
  to   { opacity:1; transform:translateY(0); }
}


/* ══════════════ ROSA ══════════════ */
.container { position:relative; }

.glass {
  height:350px; width:200px;
  background: linear-gradient(135deg, rgba(30,60,100,0.55) 0%, rgba(10,25,55,0.80) 60%, rgba(18,33,57,0.90) 100%);
  border-radius:300px 300px 0 0;
  border:1.5px solid rgba(120,160,220,0.25);
  position:relative;
}
.glass:before {
  content:""; height:10px; width:10px; transform-origin:center;
  border:10px solid rgba(18,33,57,0.95); border-radius:100%;
  position:absolute; left:87px; top:-25px;
  box-shadow:0 0 12px rgba(100,150,220,0.4);
}
.glass:after {
  content:""; position:absolute;
  height:15px; width:250px;
  background:linear-gradient(90deg,#7a1e1e,#a52a2a,#7a1e1e);
  top:100%; left:-13%;
  border-radius:0 0 4px 4px;
  box-shadow:0 4px 18px rgba(165,42,42,0.6);
}
.glass-rim {
  position:absolute; top:0; left:0; right:0; height:100%;
  border-radius:300px 300px 0 0;
  border:1px solid rgba(160,200,255,0.12); pointer-events:none;
}
.shine {
  width:12px; height:140px;
  background:linear-gradient(180deg,rgba(255,255,255,0.55),rgba(255,255,255,0.05));
  opacity:0.25; position:absolute; left:85%; top:80px;
  border-radius:100px; z-index:10;
}
.shine:before {
  content:""; width:12px; height:20px; position:absolute;
  background:rgba(255,255,255,0.3); top:160px; border-radius:100px;
}
.shine:after {
  content:""; width:5px; height:60px; position:absolute;
  background:rgba(255,255,255,0.15); top:0; left:-10px; border-radius:100px;
}
.halo {
  position:absolute; width:160px; height:160px; border-radius:50%;
  background:radial-gradient(circle,rgba(213,45,88,0.38) 0%,rgba(213,45,88,0.10) 55%,transparent 75%);
  top:30px; left:20px;
  animation:haloPulse 2.8s ease-in-out infinite;
  pointer-events:none; z-index:0;
}
@keyframes haloPulse {
  0%,100%{ opacity:.7; transform:scale(1); }
  50%    { opacity:1;  transform:scale(1.14); }
}
.particles { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:20; }
.particle {
  position:absolute; border-radius:50%;
  animation:floatUp var(--dur,4s) var(--del,0s) ease-in-out infinite; opacity:0;
}
@keyframes floatUp {
  0%  { opacity:0;  transform:translateY(0) scale(1) rotate(0deg); }
  20% { opacity:.9; }
  80% { opacity:.5; }
  100%{ opacity:0;  transform:translateY(-120px) scale(0.3) rotate(180deg); }
}

.petals > div {
  position:absolute; background:#d52d58; width:45px; height:80px; top:55px; transition:all .5s ease-out;
}
.petals > div:nth-child(1){ border-radius:15px; box-shadow:0 0 30px #f594b8; left:80px; top:60px; background:#d52d58; }
.petals > div:nth-child(2),.petals > div:nth-child(4),.petals > div:nth-child(6){ background:#b81b43; left:60px; border-radius:0 30px 0 30px; transform-origin:bottom right; }
.petals > div:nth-child(3),.petals > div:nth-child(5),.petals > div:nth-child(7){ background:#b81b43; left:100px; border-radius:30px 0 30px 0; transform-origin:bottom left; }
.petals > div:nth-child(2){ z-index:5; background:#ab1a3f; top:75px; height:70px; box-shadow:0 0 50px rgba(245,148,184,.5); animation:bloom2 3s ease-in-out forwards; }
.petals > div:nth-child(3){ z-index:4; background:#ab1a3f; top:75px; height:70px; box-shadow:0 0 50px rgba(245,148,184,.5); animation:bloom3 3s ease-in-out forwards, glowing 2.5s ease-in-out infinite; }
.petals > div:nth-child(4){ z-index:3; background:#b81b43; top:70px; height:75px; box-shadow:0 0 50px rgba(245,148,184,.5); animation:bloom4 3s ease-in-out forwards, glowing 2.5s ease-in-out infinite; }
.petals > div:nth-child(5){ z-index:2; background:#b81b43; top:70px; height:75px; box-shadow:0 0 50px rgba(245,148,184,.5); animation:bloom5 3s ease-in-out forwards, glowing 2.5s ease-in-out infinite; }
.petals > div:nth-child(6){ z-index:1; background:#c9204b; top:65px; height:70px; box-shadow:0 0 50px rgba(245,148,184,.3); animation:bloom6 3s ease-in-out forwards, glowing 2.5s ease-in-out infinite; }
.petals > div:nth-child(7){ z-index:0; background:#c9204b; top:65px; height:70px; box-shadow:0 0 50px rgba(245,148,184,.3); animation:bloom7 3s ease-in-out forwards, glowing 2.5s ease-in-out infinite; }

.deadPetals > div { position:absolute; background:#d52d58; width:20px; height:15px; top:120px; border-radius:0 30px 0 30px; box-shadow:0 0 30px rgba(245,148,184,.5); }
.deadPetals > div:nth-child(1){ left:67px;  animation:falling 20s 4s  ease-in-out infinite; }
.deadPetals > div:nth-child(2){ left:104px; animation:falling 20s 8s  ease-in-out infinite; }
.deadPetals > div:nth-child(3){ left:91px;  animation:falling 20s 12s ease-in-out infinite; }
.deadPetals > div:nth-child(4){ left:69px;  animation:falling 20s 16s ease-in-out infinite; }

.leaves > div:nth-last-child(1){ position:absolute; width:55px; height:30px; background:#338f37; top:120px; left:75px; border-radius:100px; }
.leaves > div:nth-child(1){ position:absolute; width:6px; height:210px; background:#054c05; top:95px; left:100px; border-radius:0 0 100px 100px; }
.leaves > div:nth-child(2){ position:absolute; width:30px; height:50px; border-radius:5px 40px 20px 40px; background:#054c05; transform-origin:bottom; transform:rotate(-30deg); top:180px; left:80px; box-shadow:inset 5px 5px #066406; }
.leaves > div:nth-child(3){ position:absolute; width:30px; height:50px; border-radius:40px 5px 40px 20px; background:#054c05; transform-origin:bottom; transform:rotate(30deg); top:150px; left:95px; box-shadow:inset -5px 5px #066406; }

.thorns > div { position:absolute; width:0; height:0; }
.thorns > div:nth-child(odd) { border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:5px solid #054c05; left:105px; }
.thorns > div:nth-child(even){ border-top:5px solid transparent; border-bottom:5px solid transparent; border-right:5px solid #054c05; left:95px; }
.thorns > div:nth-child(1){ top:200px; }
.thorns > div:nth-child(2){ top:170px; }
.thorns > div:nth-child(4){ top:230px; }

.shadow-rose {
  position:absolute; width:220px; height:18px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.55) 0%,transparent 75%);
  bottom:-18px; left:-10px; border-radius:50%;
}

/* ══════════════ PASTEL ══════════════ */
.cake-wrap {
  position: relative;
  animation: cakeFloat 4s 1s ease-in-out infinite;
  transform-origin: bottom center;
}
@keyframes cakeFloat {
  0%,100%{ transform: rotate(0deg) translateY(0); }
  35%    { transform: rotate(1.5deg) translateY(-4px); }
  70%    { transform: rotate(-1.5deg) translateY(-2px); }
}

.cake {
  position: relative;
  width: 160px;
  height: 180px;
  animation: cakeAppear .8s .4s ease-out both;
}
@keyframes cakeAppear {
  from{ opacity:0; transform:translateY(20px) scale(0.9); }
  to  { opacity:1; transform:translateY(0) scale(1); }
}

/* Base del pastel */
.cake-base {
  position:absolute; bottom:0; left:5px;
  width:150px; height:130px;
  background: linear-gradient(180deg, #f5a0c0 0%, #e87090 40%, #d45878 100%);
  border-radius: 10px 10px 8px 8px;
  border: 2px solid #c04868;
  box-shadow: 0 8px 30px rgba(200,70,90,0.4);
  z-index: 1;
}

/* Capas del pastel */
.cake-layer {
  position:absolute; bottom:50px; left:10px;
  width:140px; height:40px;
  background: linear-gradient(180deg, #f5b8d0 0%, #e888a8 100%);
  border-radius: 8px 8px 0 0;
  border: 2px solid #d06080;
  z-index: 2;
}
.cake-layer:before {
  content: '';
  position:absolute; bottom:10px; left:10px;
  width:120px; height:6px;
  background: repeating-linear-gradient(90deg, #f5d0e0 0px, #f5d0e0 4px, #e8a0b8 4px, #e8a0b8 8px);
  border-radius: 3px;
  opacity: 0.5;
}

/* Cobertura superior (glaseado) */
.cake-top {
  position:absolute; bottom:90px; left:8px;
  width:144px; height:18px;
  background: linear-gradient(180deg, #ffd0e0 0%, #f5b0c8 100%);
  border-radius: 50% 50% 30% 30% / 100% 100% 30% 30%;
  border: 2px solid #e880a0;
  z-index: 3;
  box-shadow: 0 -4px 20px rgba(255,150,200,0.3);
}

/* Decoración de borde (crema batida) */
.cake-cream {
  position:absolute; bottom:108px; left:0;
  width:160px; height:20px;
  z-index: 4;
}
.cake-cream span {
  display: block;
  position:absolute;
  width:22px; height:22px;
  background: radial-gradient(circle at 30% 30%, #fff8fa, #f5e0e8);
  border-radius: 50% 50% 50% 0;
  box-shadow: 0 2px 8px rgba(200,150,160,0.3);
}
.cake-cream span:nth-child(1) { left:2px; top:-6px; transform:rotate(-10deg); }
.cake-cream span:nth-child(2) { left:28px; top:-8px; transform:rotate(5deg); }
.cake-cream span:nth-child(3) { left:54px; top:-6px; transform:rotate(-8deg); }
.cake-cream span:nth-child(4) { left:80px; top:-8px; transform:rotate(12deg); }
.cake-cream span:nth-child(5) { left:106px; top:-6px; transform:rotate(-5deg); }
.cake-cream span:nth-child(6) { left:132px; top:-8px; transform:rotate(8deg); }

/* Velas */
.candle {
  position:absolute;
  width:6px;
  background: linear-gradient(180deg, #ffe080, #ffcc60);
  border-radius: 3px 3px 2px 2px;
  z-index: 10;
  box-shadow: 0 0 15px rgba(255,200,100,0.3);
}
.candle:before {
  content: '';
  position:absolute; top:-8px; left:50%;
  transform:translateX(-50%);
  width:4px; height:10px;
  background: radial-gradient(circle at 50% 80%, #ffdd44, #ff8800);
  border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  animation: flameFlicker 0.5s ease-in-out infinite alternate;
}
@keyframes flameFlicker {
  0% { transform:translateX(-50%) scale(1) rotate(-3deg); opacity:0.9; }
  100% { transform:translateX(-50%) scale(1.1, 0.9) rotate(3deg); opacity:1; }
}
.candle-1 { bottom:128px; left:45px; height:30px; animation-delay:0s; }
.candle-2 { bottom:128px; left:75px; height:35px; animation-delay:0.3s; }
.candle-3 { bottom:128px; left:105px; height:28px; animation-delay:0.6s; }

/* Luz de las velas (halo) */
.candle-glow {
  position:absolute;
  width:40px; height:40px;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,200,100,0.4) 0%, transparent 70%);
  z-index: 9;
  animation: glowPulse 1.2s ease-in-out infinite alternate;
}
@keyframes glowPulse {
  0% { opacity:0.6; transform:scale(1); }
  100% { opacity:1; transform:scale(1.3); }
}
.glow-1 { bottom:155px; left:28px; }
.glow-2 { bottom:160px; left:58px; animation-delay:0.4s; }
.glow-3 { bottom:153px; left:88px; animation-delay:0.8s; }

/* Decoraciones del pastel (chuches/frutos rojos) */
.cake-deco {
  position:absolute; z-index:5;
}
.cake-deco .berry {
  position:absolute;
  width:10px; height:12px;
  background: radial-gradient(circle at 30% 30%, #ff4466, #cc1133);
  border-radius: 50% 50% 50% 0;
  box-shadow: 0 2px 6px rgba(200,30,50,0.4);
}
.cake-deco .berry:nth-child(1) { left:25px; bottom:70px; transform:rotate(-20deg); }
.cake-deco .berry:nth-child(2) { left:125px; bottom:75px; transform:rotate(15deg); }
.cake-deco .berry:nth-child(3) { left:75px; bottom:65px; transform:rotate(5deg); width:8px; height:10px; }

/* Sombra del pastel */
.cake-shadow {
  width:170px; height:14px;
  background:radial-gradient(ellipse,rgba(0,0,0,0.5) 0%,transparent 75%);
  border-radius:50%;
  margin-top:4px;
}

/* Base decorativa del pastel (plato) */
.cake-plate {
  width:180px; height:12px;
  background:linear-gradient(90deg, #8a6a4a, #c8a888, #8a6a4a);
  border-radius:0 0 6px 6px;
  box-shadow: 0 4px 18px rgba(0,0,0,0.4);
  margin-bottom:2px;
  border:1px solid rgba(200,180,160,0.3);
}

/* Halo del pastel */
.cake-halo {
  position:absolute; top:-10px; left:-10px;
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,150,200,0.15) 0%,transparent 70%);
  animation:cakeHalo 3.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes cakeHalo {
  0%,100%{ opacity:.6; transform:scale(1); }
  50%    { opacity:1;  transform:scale(1.1); }
}

/* Partículas del pastel (confeti) */
.cake-particles { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
.cake-particle {
  position:absolute; border-radius:50%;
  animation:cakeSparkle var(--cd,3s) var(--cde,0s) ease-in-out infinite; opacity:0;
}
@keyframes cakeSparkle {
  0%  { opacity:0;  transform:translate(0,0) scale(1) rotate(0deg); }
  30% { opacity:.9; transform:translate(var(--cx,5px),var(--cy,-30px)) scale(1.2) rotate(180deg); }
  100%{ opacity:0;  transform:translate(var(--cx,15px),var(--cy,-60px)) scale(0.3) rotate(360deg); }
}

/* ══════════════ ANIMACIONES ROSA ══════════════ */
@keyframes bloom2 {
  50% { transform:rotate(-90deg); top:200px; left:100px; }
  100%{ transform:rotate(-60deg); top:252px; left:50px; background:#71122a; box-shadow:0 0 0 rgba(245,148,184,0); }
}
@keyframes bloom3{ 100%{ transform:rotate(45deg); } }
@keyframes bloom4{ 100%{ transform:rotate(-20deg); } }
@keyframes bloom5{ 100%{ transform:rotate(20deg); } }
@keyframes bloom6{ 100%{ transform:rotate(-5deg); } }
@keyframes bloom7{ 100%{ transform:rotate(5deg); } }
@keyframes glowing{ 50%{ background:#d7365f; box-shadow:0 0 60px #f594b8; } }
@keyframes falling {
  0%  { top:120px; opacity:1; transform:rotate(-30deg); }
  15% { transform:rotate(-60deg) translateX(-8px); }
  25% { transform:rotate(10deg) translateX(5px); }
  35% { top:330px; background:#9d193b; box-shadow:0 0 0 rgba(245,148,184,0); transform:rotate(-20deg); }
  45% { top:335px; opacity:.4; }
  100%{ top:335px; opacity:0; }
}
</style>

<div class="wrap" id="wrap">
  <div class="stars" id="stars"></div>

  <!-- ESCENA -->
  <div class="scene">

    <!-- ── ROSA ── -->
    <div class="container">
      <div class="shadow-rose"></div>
      <div class="glass">
        <div class="shine"></div>
        <div class="glass-rim"></div>
        <div class="halo"></div>
        <div class="particles" id="particles"></div>
      </div>
      <div class="thorns"><div></div><div></div><div></div><div></div></div>
      <div class="leaves"><div></div><div></div><div></div><div></div></div>
      <div class="petals"><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
      <div class="deadPetals"><div></div><div></div><div></div><div></div></div>
    </div>

    <!-- ── PASTEL ── -->
    <div class="cake-wrap">
      <div class="cake-halo"></div>
      <div class="cake">
        <!-- Velas -->
        <div class="candle candle-1"></div>
        <div class="candle candle-2"></div>
        <div class="candle candle-3"></div>
        <div class="candle-glow glow-1"></div>
        <div class="candle-glow glow-2"></div>
        <div class="candle-glow glow-3"></div>

        <!-- Cobertura -->
        <div class="cake-top"></div>
        <div class="cake-cream">
          <span></span><span></span><span></span><span></span><span></span><span></span>
        </div>

        <!-- Capas -->
        <div class="cake-layer"></div>
        <div class="cake-base"></div>

        <!-- Decoraciones -->
        <div class="cake-deco">
          <div class="berry"></div>
          <div class="berry"></div>
          <div class="berry"></div>
        </div>

        <!-- Partículas confeti -->
        <div class="cake-particles" id="cakeParticles"></div>
      </div>

      <div class="cake-plate"></div>
      <div class="cake-shadow"></div>
    </div>

  </div>

  <!-- TEXTO -->
  <div class="mensaje">
    Feliz cumpleaños Mamá 💖
  </div>

</div>

<script>
  /* Estrellas */
  const starsEl = document.getElementById('stars');
  for(let i=0;i<80;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2.5+1;
    s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--d:${(Math.random()*3+2).toFixed(1)}s;--delay:${(Math.random()*5).toFixed(1)}s;--op:${(Math.random()*.6+.2).toFixed(2)};`;
    starsEl.appendChild(s);
  }

  /* Partículas rosa */
  const pEl=document.getElementById('particles');
  const colors=['#ffd700','#ffb347','#ff9eb5','#ffe4e1','#fff0a0'];
  for(let i=0;i<18;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=Math.random()*4+2;
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*80+10}%;top:${Math.random()*60+30}%;background:${colors[Math.floor(Math.random()*colors.length)]};--dur:${(Math.random()*3+3).toFixed(1)}s;--del:${(Math.random()*5).toFixed(1)}s;box-shadow:0 0 ${size*2}px ${colors[Math.floor(Math.random()*colors.length)]};`;
    pEl.appendChild(p);
  }

  /* Partículas pastel (confeti) */
  const cpEl=document.getElementById('cakeParticles');
  const cakeColors=['#ff6b8a','#ffb3c6','#ffd700','#ff8a5c','#ff4080','#ffccff','#ffaa66'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='cake-particle';
    const size=Math.random()*4+2;
    const cx=(Math.random()*40-20).toFixed(0);
    const cy=-(Math.random()*50+20).toFixed(0);
    p.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*80+10}%;top:${Math.random()*70+15}%;background:${cakeColors[Math.floor(Math.random()*cakeColors.length)]};--cd:${(Math.random()*3+2.5).toFixed(1)}s;--cde:${(Math.random()*4).toFixed(1)}s;--cx:${cx}px;--cy:${cy}px;box-shadow:0 0 ${size*2}px ${cakeColors[Math.floor(Math.random()*cakeColors.length)]};border-radius:${Math.random()>0.5 ? '50%' : '2px'};`;
    cpEl.appendChild(p);
  }
</script>
